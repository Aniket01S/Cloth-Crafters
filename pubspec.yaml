    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^2.1.0
  flutter_spinkit: ^5.1.0
  smooth_page_indicator: ^1.2.0+3
  shared_preferences: ^2.0.6
  sign_in_button: ^3.2.0
